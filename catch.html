<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c120c">
<title>OYAMIL Catch</title>
<style>
  :root { --px: 4px; }
  html, body { margin: 0; height: 100%; background: #1c120c; overflow: hidden; overscroll-behavior: none; }
  body {
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed; left: 0; top: 0; touch-action: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* invisible native inputs over the pixel-drawn fields (gives a real keyboard on phones) */
  .hid-input {
    position: fixed; display: none; z-index: 5; margin: 0; padding: 0; border: 0; outline: none;
    opacity: 0; background: transparent; color: transparent; caret-color: transparent;
    font-size: 16px; -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text;
  }
  body.entry .hid-input { display: block; }
  /* analog CRT layer: scanlines + vignette + flicker */
  #crt, #grain { position: fixed; pointer-events: none; z-index: 6; }
  #crt {
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--px) * 1.5),
        rgba(24,10,0,.05) calc(var(--px) * 1.5), rgba(24,10,0,.05) calc(var(--px) * 2)),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 66%, rgba(12,5,0,.2) 100%);
    box-shadow: inset 0 0 calc(var(--px) * 8) rgba(0,0,0,.18);
    animation: flicker 9s infinite steps(1);
  }
  #grain { opacity: .035; mix-blend-mode: overlay; animation: grain .8s steps(5) infinite; }
  @keyframes flicker { 0% { opacity: 1 } 46% { opacity: .97 } 47% { opacity: 1 } 81% { opacity: .985 } 82% { opacity: 1 } }
  @keyframes grain { 0% { background-position: 0 0 } 100% { background-position: 160px 96px } }
  body.nofx #crt, body.nofx #grain { display: none; }

  /* ---------- admin (staff only) ---------- */
  #admin {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(12,7,3,.9); color: #fff3d6; touch-action: auto; user-select: text; -webkit-user-select: text;
    font: 14px/1.45 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  #admin.open { display: flex; }
  #admin [hidden] { display: none !important; }
  #admin button, #admin input, #admin select { font: inherit; }
  .adm-btn {
    background: #fff3d6; color: #1b1712; border: 2px solid #1b1712; box-shadow: 3px 3px 0 #000;
    padding: 6px 12px; cursor: pointer; font-weight: 700; white-space: nowrap;
  }
  .adm-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .adm-btn:disabled { opacity: .45; cursor: default; }
  .adm-btn.yel { background: #ffe500; } .adm-btn.red { background: #8e2a3a; color: #fff; } .adm-btn.dark { background: #3a2a22; color: #fff3d6; border-color: #fff3d6; }
  .adm-btn.small { padding: 2px 8px; font-size: 12px; box-shadow: 2px 2px 0 #000; }
  .adm-pinbox { background: #2a1c14; border: 3px solid #fff3d6; box-shadow: 8px 8px 0 #000; padding: 26px 30px; width: min(340px, 86vw); text-align: center; }
  .adm-pinbox h2 { margin: 0 0 6px; color: #ffe500; font-size: 20px; letter-spacing: .04em; }
  .adm-pinbox p { margin: 0 0 16px; color: #cdb9a6; font-size: 13px; }
  #admPinInput { width: 100%; box-sizing: border-box; font-size: 28px; letter-spacing: .5em; text-align: center; padding: 8px; background: #140d09; color: #ffe500; border: 2px solid #ffe500; outline: none; }
  .adm-err { min-height: 20px; color: #ff6a5a; font-size: 13px; margin: 8px 0 12px; }
  .adm-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .adm-main {
    width: min(1180px, 96vw); height: min(820px, 94vh); display: flex; flex-direction: column;
    background: #241812; border: 3px solid #fff3d6; box-shadow: 8px 8px 0 #000;
  }
  .adm-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #ffe500; color: #1b1712; border-bottom: 3px solid #1b1712; }
  .adm-head h1 { margin: 0; font-size: 18px; flex: 1; }
  .adm-head small { font-weight: 400; opacity: .75; margin-left: 8px; }
  .adm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 190px 1fr; }
  .adm-days { border-right: 2px solid #4a3426; overflow: auto; padding: 8px; }
  .adm-days h3 { margin: 4px 4px 8px; font-size: 12px; color: #cdb9a6; letter-spacing: .08em; }
  .adm-day { display: block; width: 100%; text-align: left; background: transparent; color: #fff3d6; border: 2px solid transparent; padding: 6px 8px; cursor: pointer; margin-bottom: 4px; }
  .adm-day:hover { border-color: #6a4c38; }
  .adm-day.on { background: #ffe500; color: #1b1712; border-color: #1b1712; }
  .adm-day span { display: block; font-size: 11px; opacity: .75; }
  .adm-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 14px; gap: 10px; }
  .adm-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .adm-stat { background: #33231a; border: 2px solid #4a3426; padding: 6px 10px; }
  .adm-stat b { display: block; font-size: 20px; color: #ffe500; }
  .adm-stat span { font-size: 11px; color: #cdb9a6; }
  .adm-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .adm-tab { background: #33231a; color: #fff3d6; border: 2px solid #6a4c38; padding: 5px 12px; cursor: pointer; }
  .adm-tab.on { background: #fff3d6; color: #1b1712; border-color: #fff3d6; font-weight: 700; }
  #admSearch { flex: 1; min-width: 160px; background: #140d09; color: #fff3d6; border: 2px solid #6a4c38; padding: 5px 8px; outline: none; }
  .adm-table-wrap { flex: 1; min-height: 120px; overflow: auto; border: 2px solid #4a3426; background: #1c120c; }
  .adm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .adm-table th { position: sticky; top: 0; background: #4a3426; color: #ffe500; text-align: left; padding: 6px 8px; white-space: nowrap; }
  .adm-table td { padding: 5px 8px; border-bottom: 1px solid #33231a; white-space: nowrap; }
  .adm-table tr:hover td { background: #2e2018; }
  .adm-table .num { text-align: right; font-family: Consolas, "D2Coding", monospace; }
  .adm-table .ok { color: #8fe08a; } .adm-table .fail { color: #ff8a7a; } .adm-table .void { color: #b0a0b8; }
  .adm-table .mail { font-family: Consolas, monospace; }
  .adm-empty { padding: 30px; text-align: center; color: #9a8676; }
  .adm-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .adm-foot .grow { flex: 1; }
  .adm-status { font-size: 12px; color: #cdb9a6; }
  .adm-status b { color: #fff3d6; }
  .adm-set { border: 2px solid #4a3426; padding: 8px 10px; }
  .adm-set summary { cursor: pointer; color: #ffe500; font-weight: 700; }
  .adm-set label { display: inline-flex; align-items: center; gap: 6px; margin: 8px 16px 0 0; font-size: 13px; }
  .adm-set input[type=text] { width: min(420px, 70vw); background: #140d09; color: #fff3d6; border: 2px solid #6a4c38; padding: 3px 6px; }
  .adm-set input[type=number], .adm-set input[type=password] { width: 90px; background: #140d09; color: #fff3d6; border: 2px solid #6a4c38; padding: 3px 6px; }
  @media (max-width: 760px) {
    .adm-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .adm-days { border-right: 0; border-bottom: 2px solid #4a3426; max-height: 110px; display: flex; gap: 4px; overflow-x: auto; }
    .adm-day { width: auto; flex: none; }
    .adm-days h3 { display: none; }
    .adm-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<canvas id="game" width="240" height="480"></canvas>
<input id="inName" class="hid-input" type="text" maxlength="40" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" aria-label="Name">
<input id="inMail" class="hid-input" type="email" inputmode="email" maxlength="80" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="E-mail">
<div id="crt"></div>
<div id="grain"></div>

<div id="admin" role="dialog" aria-label="Admin">
  <div class="adm-pinbox" id="admPin">
    <h2>STAFF ONLY</h2>
    <p>관리자 PIN을 입력하세요</p>
    <input id="admPinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="adm-err" id="admPinErr"></div>
    <div class="adm-row">
      <button class="adm-btn yel" id="admPinOk">확인</button>
      <button class="adm-btn dark" id="admPinCancel">닫기</button>
    </div>
  </div>
  <div class="adm-main" id="admMain" hidden>
    <div class="adm-head">
      <h1><span id="admTitle">OYAMIL CATCH (2안)</span> · 플레이어 데이터베이스<small id="admSub"></small></h1>
      <span id="admGames"></span>
      <button class="adm-btn dark" id="admClose">닫기 (Esc)</button>
    </div>
    <div class="adm-body">
      <nav class="adm-days" id="admDays"></nav>
      <section class="adm-panel">
        <div class="adm-stats" id="admStats"></div>
        <div class="adm-tools">
          <button class="adm-tab" data-tab="players">참가자</button>
          <button class="adm-tab" data-tab="plays">플레이 기록</button>
          <button class="adm-tab" data-tab="ranking">랭킹</button>
          <input id="admSearch" type="search" placeholder="이름·이메일 검색" autocomplete="off">
        </div>
        <div class="adm-table-wrap" id="admTableWrap"></div>
        <div class="adm-foot">
          <button class="adm-btn yel" id="admCsvPlayers">참가자 CSV</button>
          <button class="adm-btn yel" id="admCsvPlays">플레이 CSV</button>
          <button class="adm-btn" id="admJson">JSON 전체 백업</button>
          <button class="adm-btn" id="admImport">JSON 복원</button>
          <input type="file" id="admImportFile" accept=".json,application/json" hidden>
          <button class="adm-btn" id="admFolder">자동 백업 폴더</button>
          <span class="grow"></span>
          <button class="adm-btn red" id="admResetRank">오늘 랭킹 초기화</button>
        </div>
        <div class="adm-status" id="admStatus"></div>
        <details class="adm-set">
          <summary>설정</summary>
          <span id="admGameSet"></span>
          <label><input type="checkbox" id="admMailReq"> 이메일 필수 입력</label>
          <label>공유 서버 URL <input type="text" id="admServer" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></label>
          <label>BGM 볼륨 <input type="range" id="admBgm" min="0" max="100" step="5"> <span id="admBgmV"></span></label>
          <label>새 PIN <input type="password" id="admNewPin" inputmode="numeric" maxlength="8" placeholder="4~8자리"></label>
          <button class="adm-btn small yel" id="admSaveSet">설정 저장</button>
          <span class="adm-status" id="admSetMsg"></span>
        </details>
      </section>
    </div>
  </div>
</div>

const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const easeOut = x => 1 - (1 - x) * (1 - x);
const easeInOut = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  wave: [{ L: [5, 25], R: [21, 12], cup: [5, 24], eyes: 'open' }, { L: [5, 25], R: [19, 9], cup: [5, 24], eyes: 'happy' }],
  cheer: [{ L: [3, 13], R: [21, 13], eyes: 'happy', mouth: 'open' }, { L: [5, 9], R: [19, 9], eyes: 'happy', mouth: 'open' }],
  jump: [{ L: [2, 18], R: [22, 18], eyes: 'open', mouth: 'open' }, { L: [3, 14], R: [21, 14], eyes: 'happy', mouth: 'open', up: 2 }],

      rect(17, 21, 1, 4, P.bodyD); rect(6, 25, 13, 1, P.bodyD);

      for (const x of [9, 12, 15]) rect(x, 24, 1, 4, P.skirtD);

      orows([[18, 8, 16], [19, 8, 16], [20, 7, 17], [21, 7, 17]], P.body);
      rect(16, 20, 1, 2, P.bodyD);
      [[9, 18], [10, 19], [11, 20]].forEach(([x, y]) => rect(x, y, 1, 1, P.trim));
      rect(12, 20, 2, 1, P.trim); rect(12, 21, 1, 1, P.trim); rect(13, 22, 1, 1, P.trim); rect(14, 23, 1, 1, P.trim);

      for (const [x, y] of [[9, 4], [12, 3], [15, 4]]) disc(x, y, 2, P.flower);

    for (const [s, h] of arms) stroke(s[0], s[1], h[0], h[1], 4, OUTL);
    for (const [s, h] of arms) { stroke(s[0], s[1], h[0], h[1], 2, P.body); }

    for (const [s, h] of arms) { const cx = Math.round(lerp(s[0], h[0], 0.72)), cy = Math.round(lerp(s[1], h[1], 0.72)); rect(cx - 1, cy - 1, 2, 2, boy ? P.trim : P.trim); }

/* ================= TUMBLER (transparent, 330 ml) ================= */
function makeTumbler(cx, bottom, w, h) {
  const T = { cx: Math.round(cx), bottom: Math.round(bottom), w, h };
  T.top = T.bottom - h; T.base = Math.max(4, Math.round(h * 0.06));
  T.floor = T.bottom - T.base;                             // inner floor (first liquid row is floor-1)
  T.hw = y => Math.round((w / 2) * (1 - 0.12 * clamp((y - T.top) / h, 0, 1)));
  T.inL = y => T.cx - T.hw(y) + 2;
  T.inR = y => T.cx + T.hw(y) - 2;                         // exclusive
  T.innerH = T.floor - (T.top + 2);
  T.levelY = f => Math.round(T.floor - clamp(f, 0, 1.02) * T.innerH);
  return T;
}
// pixel-exact clip path of the tumbler's inside (cached per tumbler)
function tumblerClip(T) {
  if (T.clip) return T.clip;
  const p = new Path2D();
  for (let y = T.top + 1; y < T.floor; y++) p.rect(T.inL(y), y, T.inR(y) - T.inL(y), 1);
  return (T.clip = p);
}
// warm room backdrop: hanji wall with a 창살 lattice + wooden table
function makeRoomBG(tableY) {
  const WOODR = ramp(['#8e5c33', '#9a663a', '#a57040', '#b07a47', '#ba844f', '#c48e58']);
  const rand = mulberry32(77), plankH = 13, n = Math.ceil((H - tableY) / plankH) + 2;
  const tone = Array.from({ length: n }, () => rand() * 0.8 - 0.4), off = Array.from({ length: n }, () => rand() * 300);
  const WALL = ramp(['#e2d3ad', '#eadcb8', '#f0e5c6', '#f5ecd2']);
  return makeSprite(W, H, (x, y) => {
    if (y < tableY) {
      const gx = (x + 6) % 36, gy = (y + 10) % 36;
      if (gx === 0 || gy === 0) return hex('#cdb88c');
      if (gx === 1 || gy === 1) return hex('#e8dab4');
      const shade = clamp((y - (tableY - 40)) / 40, 0, 1);
      return WALL[clampI(2.6 - shade * 1.6 + (((x * 13 + y * 7) % 17) === 0 ? -1 : 0) + bayer(x, y) - 0.5, 0, 3)];
    }
    if (y === tableY) return hex('#5a3a20');
    if (y < tableY + 3) return hex('#c99a66');
    const p = Math.floor((y - tableY - 3) / plankH), yy = (y - tableY - 3) - p * plankH;
    if (yy === 0) return [104, 66, 36];
    const gr = Math.sin((x + off[p]) * 0.03 + Math.sin(yy * 0.25 + p) * 1.4 + Math.sin((x + off[p]) * 0.009) * 2.5);
    return WOODR[clampI(2.6 + tone[p] + gr * 0.45 + bayer(x, y) - 0.5, 0, 5)];
  });
}
// daytime sky (dithered gradient + pixel clouds) over a wooden table — high contrast for falling powder
function makeSkyBG(tableY) {
  const SKY = ramp(['#8fcbe6', '#a3d5ec', '#b7def0', '#cbe7f4', '#ddf0f8', '#eef8fb']);
  const WOODR = ramp(['#8e5c33', '#9a663a', '#a57040', '#b07a47', '#ba844f', '#c48e58']);
  const rand = mulberry32(5), clouds = Array.from({ length: 6 }, () => ({ x: rand() * W, y: 40 + rand() * (tableY - 120), w: 26 + rand() * 30 }));
  const cloud = (x, y) => clouds.some(c => { const dx = (x - c.x) / c.w, dy = (y - c.y) / (c.w * 0.32); return dx * dx + dy * dy < 1 || ((x - c.x + c.w * 0.3) / (c.w * 0.45)) ** 2 + ((y - c.y + c.w * 0.18) / (c.w * 0.3)) ** 2 < 1; });
  return makeSprite(W, H, (x, y) => {
    if (y < tableY) {
      if (cloud(x, y)) return cloud(x, y + 2) ? hex('#ffffff') : hex('#d6ecf6');
      return SKY[clampI((y / tableY) * 5.2 + bayer(x, y) - 0.5, 0, 5)];
    }
    if (y === tableY) return hex('#5a3a20');
    if (y < tableY + 3) return hex('#c99a66');
    const yy = (y - tableY - 3) % 13;
    if (yy === 0) return [104, 66, 36];
    const gr = Math.sin(x * 0.03 + Math.sin(yy * 0.25) * 1.4 + Math.sin(x * 0.009) * 2.5);
    return WOODR[clampI(2.6 + gr * 0.45 + bayer(x, y) - 0.5, 0, 5)];

}

  const hwb = T.hw(T.bottom - 1); rect(T.cx - hwb + 1, T.bottom - 1, hwb * 2 - 2, 1, E);

function drawWaterIn(T, f, t, opts = {}) {
  const ys = T.levelY(f);

/* ================= AUDIO: synth SFX + master bus ================= */
const Sound = {
  ctx: null, master: null, sfx: null, noise: null, muted: false, pour: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); Music.start(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    const lim = c.createDynamicsCompressor();
    lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.12;
    lim.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(lim);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    if (c.state === 'suspended') c.resume();
    Music.start();
  },
  tone(f, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(o.bus || this.sfx); osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  burst(dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (o.at || 0), s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 2000, t0);
    if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    fl.Q.value = o.q || 1; g.gain.setValueAtTime(o.vol || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl); fl.connect(g); g.connect(o.bus || this.sfx); s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + 0.02);
  },
  // pouring water: a stream of tiny rising "bubble" chirps (the plink-glug of water hitting water),
  // a splashy noise bed with irregular flutter, and a cavity tone whose pitch climbs as the cup fills
  pourOn() {
    const c = this.ctx; if (!c || this.pour) return;
    const t = c.currentTime;
    const bed = c.createBufferSource(), hp = c.createBiquadFilter(), lp = c.createBiquadFilter(), bedG = c.createGain();
    bed.buffer = this.noise; bed.loop = true;
    hp.type = 'highpass'; hp.frequency.value = 300; lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.7;
    bedG.gain.value = 0;
    bed.connect(hp); hp.connect(lp); lp.connect(bedG); bedG.connect(this.sfx);
    const mod = c.createBufferSource(), mlp = c.createBiquadFilter(), modG = c.createGain();   // slow random flutter of the splash
    mod.buffer = this.noise; mod.loop = true; mlp.type = 'lowpass'; mlp.frequency.value = 18; modG.gain.value = 3.5;
    mod.connect(mlp); mlp.connect(modG); modG.connect(bedG.gain);
    const cav = c.createBufferSource(), bp = c.createBiquadFilter(), cavG = c.createGain();
    cav.buffer = this.noise; cav.loop = true; bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 12; cavG.gain.value = 0;
    cav.connect(bp); bp.connect(cavG); cavG.connect(this.sfx);
    bed.start(t, Math.random()); mod.start(t, Math.random()); cav.start(t, Math.random());
    bedG.gain.setTargetAtTime(0.12, t, 0.05); cavG.gain.setTargetAtTime(1.2, t, 0.1);
    this.pour = { srcs: [bed, mod, cav], gains: [bedG, cavG], bp, fill: 0, next: t, timer: 0 };
    this.pour.timer = setInterval(() => this.pourBubbles(), 25);
    this.pourBubbles();
  },
  pourBubbles() {
    const c = this.ctx, P = this.pour; if (!c || !P) return;
    while (P.next < c.currentTime + 0.1) {
      const t = Math.max(P.next, c.currentTime), r = Math.random(), glug = Math.random() < 0.08;
      const f0 = (glug ? 190 + Math.random() * 160 : 480 + r * r * 1700) * (1 + 0.6 * P.fill);

/* ================= AUDIO: original chiptune loop (pentatonic, generated live) ================= */
const BPM = 128, STEP = 60 / BPM / 2;              // 8th-note grid
const MEL = [
  76, 79, 81, 79, 76, 74, 72, 74, 76, -1, 79, -1, 81, 84, 81, 79,
  81, 79, 76, 74, 72, 74, 76, 79, 74, -1, -1, -1, 0, 0, 67, 69,
  72, 74, 76, 79, 81, -1, 79, 76, 79, -1, 76, -1, 74, 72, 74, 76,
  72, 74, 76, 79, 81, 79, 76, 74, 72, -1, -1, -1, 0, 0, 0, 0,
];
const BASS = [48, 48, 45, 43, 41, 48, 43, 48];
const DUCK = { menu: { g: 1, f: 12000 }, result: { g: 0.55, f: 4000 }, game: { g: 0.28, f: 1800 } };
const Music = {
  on: false, step: 0, nextT: 0, timer: 0, mode: '', nodes: null,
  start() {
    const c = Sound.ctx; if (!c || this.on) return;
    this.on = true;

    n.bus = c.createGain(); n.bus.gain.value = 0.5;
    n.lp = c.createBiquadFilter(); n.lp.type = 'lowpass'; n.lp.frequency.value = 12000;
    n.duck = c.createGain(); n.vol = c.createGain(); n.vol.gain.value = settings.bgmVol;
    n.bus.connect(n.lp); n.lp.connect(n.duck); n.duck.connect(n.vol); n.vol.connect(Sound.master);
    this.nextT = c.currentTime + 0.12; this.step = 0;

    this.mode = ''; this.update();
  },
  note(type, midi, t, dur, vol) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(440 * Math.pow(2, (midi - 69) / 12), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(vol * 0.5, t + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.nodes.bus); o.start(t); o.stop(t + dur + 0.02);
  },
  hit(kind, t) {
    const c = Sound.ctx;
    if (kind === 'kick') { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g); g.connect(this.nodes.bus); o.start(t); o.stop(t + 0.18); return; }

    const v = kind === 'hat' ? 0.05 : 0.11, d = kind === 'hat' ? 0.03 : 0.1;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.nodes.bus); s.start(t, Math.random()); s.stop(t + d + 0.02);
  },
  schedule() {
    const c = Sound.ctx; if (!c || !this.on) return;
    while (this.nextT < c.currentTime + 0.2) {
      const i = this.step, t = this.nextT, m = MEL[i];
      if (m > 0) { let len = 1; while (MEL[(i + len) % MEL.length] === -1) len++; this.note('square', m, t, STEP * len * 0.92, 0.05); this.note('triangle', m + 12, t, STEP * 0.5, 0.02); }
      if (i % 2 === 0) { const root = BASS[Math.floor(i / 8) % 8], arp = [0, 12, 7, 12][(i / 2) % 4]; this.note('triangle', root + arp, t, STEP * 1.8, 0.16); }
      const b = i % 8;
      if (b === 0 || b === 4) this.hit('kick', t);
      if (b === 2 || b === 6) this.hit('snare', t);
      if (i % 2 === 1) this.hit('hat', t);

    }

  setVolume(v) { settings.bgmVol = v; if (this.nodes) this.nodes.vol.gain.setTargetAtTime(v, Sound.ctx.currentTime, 0.05); },
  update() {
    if (!this.nodes) return;
    const m = state === 'play' ? (GAME.musicMode ? GAME.musicMode() : 'game') : 'menu';
    if (m === this.mode) return;
    this.mode = m;
    const t = Sound.ctx.currentTime, tc = m === 'game' ? 0.2 : 0.6;
    this.nodes.duck.gain.setTargetAtTime(DUCK[m].g, t, tc);
    this.nodes.lp.frequency.setTargetAtTime(DUCK[m].f, t, tc);
  },

const IOS_HAPTIC = (() => { if (navigator.vibrate || !COARSE) return null; try { const l = document.createElement('label'), i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); l.style.display = 'none'; l.setAttribute('aria-hidden', 'true'); document.body.appendChild(l); return l; } catch (e) { return null; } })();

/* ================= DATA: players & plays (IndexedDB + local mirror + optional backup folder) ================= */

}
function loadGameData(def) {

  const m = lsGet(lsKey(def.id, 'db'), null);

function bindData() { const d = DATA[GAME_ID]; players = d.players; plays = d.plays; settings = d.settings; dbStatus = d.dbStatus; }

const DB = {
  dbs: {},
  get db() { return this.dbs[GAME_ID] || null; },
  open(id = GAME_ID) {

      let req; try { req = indexedDB.open(id, 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => {
        const d = req.result;

        if (!d.objectStoreNames.contains('plays')) d.createObjectStore('plays', { keyPath: 'id' }).createIndex('day', 'day');
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
      };
      req.onsuccess = () => { this.dbs[id] = req.result; res(req.result); };
      req.onerror = () => res(null); req.onblocked = () => res(null);
    });
  },
  tx(store, mode, fn, id = GAME_ID) {

        t.oncomplete = () => res(r ? r.result : null); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

  del(store, key, id) { return this.tx(store, 'readwrite', s => s.delete(key), id).catch(e => console.warn('db del', e)); },

async function initDB(id = GAME_ID) {

  const [ps, pl] = await Promise.all([DB.all('players', id), DB.all('plays', id)]);
  if (id === GAME_ID) storeData();                       // pick up anything added while the database was opening
  const pIds = new Set((ps || []).map(p => p.pid)), lIds = new Set((pl || []).map(p => p.id));
  for (const p of d.players) if (!pIds.has(p.pid)) DB.put('players', p, id);
  for (const p of d.plays) if (!lIds.has(p.id)) DB.put('plays', p, id);
  const pMap = new Map(d.players.map(p => [p.pid, p])); for (const p of ps || []) pMap.set(p.pid, p);
  const lMap = new Map(d.plays.map(p => [p.id, p])); for (const p of pl || []) lMap.set(p.id, p);
  d.players = [...pMap.values()].sort(byAt); d.plays = [...lMap.values()].sort(byAt);

function addPlayer(p) {

  Server.queue({ type: 'player', game: GAME_ID, pid: p.pid, day: p.day, at: p.at, name: p.name, email: p.email, consent: !!p.consent, key: keyHash(p) });
}
function addPlay(p) {
  plays.push(p); DB.put('plays', p); saveMirror(); Backup.schedule();
  const detail = {}; for (const k of ['c', 'i', 'p', 'g', 'b', 'dur', 'mode', 'sens', 'tol']) if (p[k] != null) detail[k] = p[k];
  Server.queue({ type: 'play', game: GAME_ID, id: p.id, pid: p.pid, day: p.day, at: p.at, name: p.name, score: p.score, ml: p.ml, diff: p.diff,
    ok: !!p.ok, void: !!p.void, detail, key: keyHash(p) }, { game: GAME_ID, day: rankDayKey(), key: keyHash(p) });

function deletePlay(id) { plays = plays.filter(p => p.id !== id); DB.del('plays', id); saveMirror(); rebuildRanking(); Backup.schedule(); }
function deletePlayer(pid) {
  for (const p of plays.filter(q => q.pid === pid)) DB.del('plays', p.id);
  plays = plays.filter(q => q.pid !== pid); players = players.filter(p => p.pid !== pid);
  DB.del('players', pid); saveMirror(); rebuildRanking(); Backup.schedule();

function importData(obj) {
  let np = 0, nl = 0;
  const pIds = new Set(players.map(p => p.pid)), lIds = new Set(plays.map(p => p.id));
  for (const p of (obj.players || [])) if (p && p.pid && !pIds.has(p.pid)) { players.push(p); DB.put('players', p); np++; }
  for (const p of (obj.plays || [])) if (p && p.id && !lIds.has(p.id)) { plays.push(p); DB.put('plays', p); nl++; }
  players.sort(byAt); plays.sort(byAt); saveMirror(); rebuildRanking(); Backup.schedule();

// ranking: one entry per player (e-mail, or registration id when no e-mail); order from GAME.cmp
const rankKey = p => p.email ? 'e:' + p.email.toLowerCase() : 'p:' + (p.pid || p.name);
function rankingFor(day, applyReset, id = GAME_ID) {
  const def = gameById(id), cur = id === GAME_ID, d = DATA[id] || {};
  const list = cur ? plays : d.plays || [], st = cur ? settings : d.settings || {};
  const since = applyReset ? (st.rankReset || {})[RANK_ALL ? 'all' : day] || '' : '';
  const best = new Map();
  for (const p of list) {
    if (!def.ranked(p) || (day && p.day !== day) || (since && p.at < since)) continue;
    const k = rankKey(p), b = best.get(k);
    if (!b || def.cmp(p, b) < 0 || (def.cmp(p, b) === 0 && p.at < b.at)) best.set(k, p);
  }
  return [...best.values()].sort((a, b) => def.cmp(a, b) || byAt(a, b));

function rebuildRanking() { rankDay = today(); RANK = rankingFor(RANK_ALL ? null : rankDay, true); }
/* ================= SHARED SERVER (Google Apps Script web app · see server/Code.gs) =================

  on() { return /^https:\/\/\S+$/.test(this.url) || /^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(this.url); },
  setUrl(u) { this.url = String(u || '').trim(); lsSet(SERVER_LS, this.url); this.boards = {}; this.status = this.on() ? 'pending' : 'off'; this.tick(true); },
  saveOutbox() { if (this.outbox.length > 3000) this.outbox.splice(0, this.outbox.length - 3000); lsSet(OUTBOX_LS, this.outbox); },

function drawRankRow(p, idx, y, now, u, cols) {

  if (k <= 0) return;

  const { bx, bw } = cols;

  if (idx < 3) ctx.drawImage(CROWNS[idx], cols.rank - 13 + ox, y - 4, 26, 20);
  else text(String(idx + 1), cols.rank + ox, y, { s: 2, c: '#d9c7a8', align: 'center' });
  const sc = GAME.fmt(p), sw = textW(sc, 2), avail = cols.score - sw - 6 - cols.name;

/* ================= LOOP ================= */
let last = performance.now(), dayCheck = 0, syncCheck = -1e9;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const t = now / 1000;
  if (state === 'title') updateTitle(dt, now);
  if (state === 'entry' && entryDoneT && now - entryDoneT > 650) { showInputs(false); resize(); goPlay(); }
  if (state === 'play') GAME.update(dt, now);
  if (!Admin.open) {
    if (state === 'entry' && !entryDoneT && now - lastInput > ENTRY_IDLE_MS) goTitle();
    if (((state === 'play' && GAME.idle && GAME.idle()) || state === 'rank') && now - lastInput > IDLE_MS) goTitle();
  }
  if (now - dayCheck > 5000) { dayCheck = now; if (today() !== rankDay) rebuildRanking(); }
  if (now - syncCheck > 15000) { syncCheck = now; Server.tick(); }
  updateParticles(dt);
  Music.update();

  ctx.imageSmoothingEnabled = false;
  dctx.clearRect(0, 0, cvs.width, cvs.height);
  if (state === 'title') drawTitle(now, t);
  else if (state === 'entry') drawEntry(now, t);
  else if (state === 'rank') drawRank(now, t);
  else GAME.draw(now, t, dt);
  drawParticles(now, 2);
  drawIcons();
  drawToast(now);
  if (LANDSCAPE && COARSE) drawRotateHint();
  flush();
  requestAnimationFrame(frame);
}

    Object.assign(CT, { sub: 'ready', t0: performance.now(), score: 0, items: [], pops: [], rings: [], fill: 0, fillShown: 0, spawnAcc: 0, rainAcc: 0, shakeUntil: 0, flashT: -1e9, goldT: -1e9, resT: 0, caught: { i: 0, c: 0, g: 0, b: 0 }, drag: null, off: 0, lastSec: 0, rec: null, rushT: 0 });
  },
  leave() { CT.items = []; CT.sub = 'ready'; },
  idle: () => CT.sub === 'ready' && !CT.drag,
  buttons: () => CT.sub === 'result' ? [G.ct.btn] : [],
  musicMode: () => CT.sub === 'result' ? 'result' : CT.sub === 'ready' ? 'menu' : 'game',
  down(p, tm, e) {
    if (CT.sub === 'ready') { CT.drag = { x0: p.x, id: e ? e.pointerId : null }; return; }
    if (CT.sub === 'running') { ctTap(p); return; }
    if (CT.sub === 'result' && performance.now() - CT.resT > 700) { press('main'); Sound.click(); goRank(); }
  },
  move(p, tm, e) {
    if (CT.sub !== 'ready' || !CT.drag || (e && CT.drag.id != null && e.pointerId !== CT.drag.id)) return;
    CT.off = clamp(p.x - CT.drag.x0, -50, 50);
    if (Math.abs(CT.off) > 38) ctStart();
  },
  up() { CT.drag = null; },
  cancel() { CT.drag = null; },
  key() {
    if (CT.sub === 'ready') ctStart();
    else if (CT.sub === 'result' && performance.now() - CT.resT > 700) goRank();
  },
  update(dt, now) { ctUpdate(dt, now); },
  draw(now, t) { ctDraw(now, t); },
  drawBackdrop(now, t) { ctScene(now, t, true); },
  // loading (player entry) screen: introduce the 7 ingredients under the progress bar
  // the mascots greet on both sides; the ingredients (without chestnut) rotate in the middle
  drawEntryFooter(y0, room, now, t) {
    if (room < 76) return false;
    const off = Math.min(60, Math.max(0, (room - (room >= 116 ? 118 : 78)) >> 1));   // centre the block on tall screens
    y0 += off; room -= off;
    const list = ENTRY_INGR, k = Math.floor(now / 2000) % list.length, g = list[k], fr = Math.floor(t / 0.35) % 2;
    text('100% KOREAN-GROWN INGREDIENTS', W / 2, y0 + 1, { align: 'center', c: '#ffd23a' });
    let y = y0 + 12;
    const row = room >= 116;                                       // fits every screen (shortest: H 400 → room 117)
    if (row) {                                                     // all 7 icons in a row, small English names underneath
      const slot = 33, x0 = (W - slot * list.length) >> 1;
      list.forEach((it, i) => {
        const x = x0 + i * slot + 6, cx = x0 + i * slot + slot / 2;
        if (i === k) { roundRect(x - 3, y - 3, 26, 26, 4, '#ffd23a'); roundRect(x - 2, y - 2, 24, 24, 3, '#2a1c14'); }
        ctx.drawImage(INGR_SPR[it.i], x, y);
        it.tiny.forEach((ln, j) => tinyText(ln, cx, y + 25 + j * 6, i === k ? '#ffd23a' : '#cdbca9'));
      });
      y += 40;
    }
    const my = y + Math.max(0, Math.min(16, (y0 + room - y - 66) >> 1));
    drawScaled(CHARS.girl[entryDoneT ? 'cheer' : 'sip'][fr], 4, my, 2);
    drawScaled(CHARS.boy[entryDoneT ? 'cheer' : 'wave'][fr], W - 52, my, 2);
    let cy = my + 4;
    if (room < 150) { ctx.drawImage(INGR_SPR[g.i], (W >> 1) - 10, cy); cy += 24; }
    text(g.label, W / 2, cy, { align: 'center', c: '#ffd23a' });
    wrapWords(g.desc, 124, 124).forEach((ln, j) => text(ln, W / 2, cy + 11 + j * 10, { align: 'center', c: CREAM }));
    return true;
  },
};

function ctStart() {
  if (CT.sub !== 'ready') return;
  CT.drag = null; CT.sub = 'intro'; CT.t0 = performance.now();
  Sound.sprinkle(); buzz(40);
}
function ctStickPos(now) {
  const P = G.ct;
  if (CT.sub === 'ready') return { x: P.home.x + CT.off, y: P.home.y + Math.round(Math.sin(now / 450)), a: CT.off * 0.004 };
  const sweep = (u) => ({ x: W / 2 + Math.sin(u / 1000 * 1.25) * (W / 2 - 34), y: P.sweepY, a: 2.35 + Math.sin(u / 1000 * 5) * 0.18 });
  if (CT.sub === 'intro') {
    const k = easeInOut(clamp((now - CT.t0) / 650, 0, 1)), s = sweep(0);
    return { x: lerp(P.home.x + CT.off, s.x, k), y: lerp(P.home.y, s.y, k), a: lerp(CT.off * 0.004, s.a, k) };
  }
  return sweep(CT.sub === 'running' ? now - CT.t0 : CT.resT - CT.t0);
}
function ctSpawn(prog, rush) {
  const r = Math.random();
  let kind;
  if (rush) {                                   // bomb 55 %, the rest keeps the normal proportions
    const k = (1 - RUSH_BOMB) / (1 - MIX.bomb);
    kind = r < RUSH_BOMB ? 'bomb' : r < RUSH_BOMB + MIX.ing * k ? 'ing' : r < RUSH_BOMB + (MIX.ing + MIX.char) * k ? 'char' : 'gold';
  } else kind = r < MIX.ing ? 'ing' : r < MIX.ing + MIX.bomb ? 'bomb' : r < MIX.ing + MIX.bomb + MIX.char ? 'char' : 'gold';
  const base = ctFall(prog) * rnd(0.85, 1.15);
  const it = { kind, who: Math.random() < 0.5 ? 'boy' : 'girl', pose: pick(POSE_NAMES), poseT: rnd(0.5, 1.2), motion: pick(MOTIONS),
    x0: rnd(30, W - 30), y: -18, age: 0, ph: rnd(0, 6.28), rot: 0, vr: rnd(2, 4) * (Math.random() < 0.5 ? -1 : 1), hop: 0,
    vy: base * (kind === 'gold' ? 1.4 : kind === 'bomb' ? 1.05 : 1), r: ITEM_R[kind] };
  if (kind === 'ing') { it.which = pick(ENTRY_INGR).i; it.motion = pick(['spin', 'sway', 'flutter', 'swing']); }
  if (kind === 'bomb') it.motion = pick(['sway', 'swing', 'zigzag']);
  it.x = it.x0;
  CT.items.push(it);
}
function ctTap(p) {
  let best = null, bd = 1e9;
  for (const it of CT.items) { if (it.dead) continue; const d = Math.hypot(p.x - it.x, p.y - (it.y + it.hop)); if (d < it.r + 9 && d < bd) { bd = d; best = it; } }
  if (!best) { CT.rings.push({ x: p.x, y: p.y, t: performance.now() }); Sound.miss(); return; }
  const it = best, now = performance.now(), x = it.x, y = it.y + it.hop;
  it.dead = true;
  if (it.kind === 'bomb') {
    CT.score = 0; CT.caught.b++; CT.fill = 0; CT.shakeUntil = now + 420; CT.flashT = now;
    CT.pops.push({ x, y, txt: 'RESET!', c: '#ff4b3a', t: now, s: 2 });
    Sound.boom(); buzz([220, 60, 120]);
    for (let i = 0; i < 46; i++) { const a = Math.random() * Math.PI * 2, v = rnd(30, 140); addP({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 60, drag: 2, life: rnd(0.4, 0.9), max: 0.9, kind: 'puff', rgb: hex(pick(['#ffd23a', '#ff8a3a', '#e23b2c', '#5a5050', '#fff3a0'])), s: 2, a: 1, layer: 1 }); }
    const T = G.ct.T;
    for (let i = 0; i < 24; i++) addP({ x: T.cx + rnd(-20, 20), y: T.levelY(CT.fillShown * 0.9), vx: rnd(-50, 50), vy: rnd(-120, -40), g: 260, life: 1, max: 1, kind: 'puff', rgb: MISU[2 + (i % 3)], s: 2, a: 0.9, layer: 1 });
    return;
  }
  const pts = it.kind === 'gold' ? 5 : it.kind === 'char' ? 2 : 1;
  CT.score += pts; CT.caught[it.kind === 'ing' ? 'i' : it.kind === 'char' ? 'c' : 'g']++;
  CT.fill = Math.min(1, CT.score / 60);
  CT.pops.push({ x, y, txt: '+' + pts, c: pts === 5 ? '#ffd23a' : pts === 2 ? '#ff9ab0' : WHITE, t: now, s: pts === 5 ? 3 : 2 });
  if (pts === 5) { Sound.gold(); buzz([25, 30, 25]); CT.goldT = now; } else { Sound.pop(pts === 2 ? 5 : Math.min(8, CT.score % 9)); buzz(15); }
  const cols = pts === 5 ? ['#fff3a0', '#ffd23a', WHITE] : pts === 2 ? ['#fff6f2', '#f7cdd4', '#fbd9d1'] : INGR[it.which].col;
  for (let i = 0; i < (pts === 5 ? 26 : 12); i++) { const a = Math.random() * Math.PI * 2, v = rnd(30, 90); addP({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, g: 120, life: rnd(0.35, 0.7), max: 0.7, kind: pts === 5 ? 'star' : 'dot', c: pick(cols), s: 2, layer: 1 }); }
}
function ctFinish(now) {
  CT.sub = 'result'; CT.resT = now;
  for (const it of CT.items) it.leaving = true;
  const c = CT.caught;
  const lp = savePlay({ score: CT.score, i: c.i, c: c.c, g: c.g, b: c.b, dur: Math.round(ctDur() / 1000), void: false });
  CT.rec = lp.rec;
  if (CT.score >= 10) Sound.win(); else Sound.lose();
  if ((lp.pb && myRank() === 0 && CT.score > 0) || CT.score >= 40) confettiRain(100);
  buzz([90, 60, 160]);
}
function ctUpdate(dt, now) {
  const P = G.ct;
  CT.fillShown += (CT.fill - CT.fillShown) * Math.min(1, dt * 6);
  // powder rain from the stick (and a fine curtain across the top)
  if (CT.sub === 'intro' || CT.sub === 'running') {
    const s = ctStickPos(now), m = stickMouth(s.x, s.y, s.a);
    CT.rainAcc += dt * (CT.sub === 'intro' ? 60 : 110);
    while (CT.rainAcc >= 1) {
      CT.rainAcc--;
      const amb = Math.random() < 0.45;
      addP({ x: amb ? rnd(0, W) : m.x + rnd(-3, 3), y: amb ? rnd(20, 32) : m.y, vx: amb ? rnd(-8, 8) : rnd(-30, 30), vy: amb ? rnd(40, 75) : rnd(35, 80), g: 45, life: 9, max: 9, c: rgbStr(MISU[2 + (Math.random() * 4 | 0)]), s: Math.random() < 0.45 ? 2 : 1, floor: G.ct.tableY + rnd(0, 6) });
    }
    if (Math.random() < dt * 8) addP({ x: m.x + rnd(-4, 4), y: m.y + 4, vx: rnd(-20, 20), vy: rnd(20, 40), g: 10, drag: 1.5, life: 0.9, max: 0.9, kind: 'puff', rgb: MISU[1], s: 3, a: 0.7 });
  }
  if (CT.sub === 'intro' && now - CT.t0 > 650) { CT.sub = 'running'; CT.t0 = now; CT.lastSec = Math.ceil(ctDur() / 1000); Sound.go(); }
  if (CT.sub === 'running') {
    const el = now - CT.t0, prog = clamp(el / ctDur(), 0, 1);
    const rush = ctDur() - el <= RUSH_MS;
    if (rush && !CT.rushT) { CT.rushT = now; Sound.rush(); buzz([60, 40, 60]); }
    CT.spawnAcc += dt * DENSITY * W * ctFall(prog);
    while (CT.spawnAcc >= 1) { CT.spawnAcc--; ctSpawn(prog, rush); }
    const left = Math.ceil((ctDur() - el) / 1000);
    if (left < CT.lastSec) { CT.lastSec = left; if (left <= 5 && left > 0) Sound.tone(1200, 0.06, { vol: 0.08 }); }
    if (el >= ctDur()) ctFinish(now);
  } else if (CT.sub === 'result' && now - CT.resT > RESULT_MS + 600) goRank();
  // items
  for (const it of CT.items) {
    it.age += dt;
    const fl = it.motion === 'flutter' ? 0.55 + 0.6 * Math.sin(it.age * 5 + it.ph) ** 2 : 1;
    it.y += it.vy * dt * fl * (it.leaving ? 2.5 : 1);
    if ((it.poseT -= dt) <= 0) { it.pose = pick(POSE_NAMES); it.poseT = rnd(0.6, 1.4); }
    it.hop = 0;
    switch (it.motion) {
      case 'sway': it.x = it.x0 + Math.sin(it.age * 2.4 + it.ph) * 14; it.rot = Math.sin(it.age * 2.4 + it.ph) * 0.15; break;
      case 'spin': it.x = it.x0 + Math.sin(it.age * 1.5 + it.ph) * 6; it.rot += it.vr * dt; break;
      case 'swing': it.x = it.x0 + Math.sin(it.age * 3 + it.ph) * 8; it.rot = Math.sin(it.age * 3 + it.ph) * 0.5; break;
      case 'zigzag': { const q = (it.age * 0.9 + it.ph) % 2; it.x = it.x0 + (q < 1 ? q : 2 - q) * 36 - 18; it.rot = q < 1 ? 0.18 : -0.18; break; }
      case 'flutter': it.x = it.x0 + Math.sin(it.age * 1.8 + it.ph) * 18; it.rot = Math.cos(it.age * 1.8 + it.ph) * 0.25; break;
      case 'bob': it.x = it.x0 + Math.sin(it.age * 2 + it.ph) * 5; it.hop = -Math.abs(Math.sin(it.age * 7 + it.ph)) * 5; it.rot = 0; break;
    }
    if (it.kind === 'gold' && Math.random() < dt * 14) addP({ x: it.x + rnd(-12, 12), y: it.y + rnd(-14, 14), vx: 0, vy: -8, life: 0.35, max: 0.35, kind: 'star', c: pick(['#fff3a0', WHITE, '#ffd23a']), layer: 1 });
  }
  CT.items = CT.items.filter(it => !it.dead && it.y < H + 30);
  CT.pops = CT.pops.filter(p => now - p.t < 800);
  CT.rings = CT.rings.filter(r => now - r.t < 250);
}

/* ---------- drawing ---------- */
function ctItem(it, t) {
  const x = Math.round(it.x), y = Math.round(it.y + it.hop);
  if (it.kind === 'ing') { drawRotated(INGR_SPR[it.which], x, y, it.rot * 0.6); return; }
  if (it.kind === 'bomb') {
    drawRotated(BOMB, x, y, it.rot * 0.5);
    const a = it.rot * 0.5, fx = 6, fy = -7, sx = x + fx * Math.cos(a) - fy * Math.sin(a), sy = y + fx * Math.sin(a) + fy * Math.cos(a);
    const f = Math.floor(t * 20 + it.ph * 3) % 3;
    rect(sx, sy, 1, 1, WHITE); rect(sx + (f === 0 ? 1 : -1), sy - 1, 1, 1, '#ffd23a'); rect(sx + (f === 2 ? 1 : 0), sy + (f === 1 ? 1 : -2), 1, 1, '#ff8a3a');
    return;
  }
  const fr = Math.floor(it.age / 0.22) % 2, spr = (it.kind === 'gold' ? GOLDS : CHARS)[it.who][it.pose][fr];
  if (Math.abs(it.rot) < 0.03) ctx.drawImage(spr, x - 12, y - 16); else drawRotated(spr, x, y, it.rot);
}
function ctScene(now, t, still) {
  const P = G.ct, T = P.T;
  ctx.save();
  if (CT.shakeUntil > now) ctx.translate((Math.random() * 5 | 0) - 2, (Math.random() * 5 | 0) - 2);
  ctx.drawImage(ctBG, 0, 0);
  // tumbler at the bottom collects the powder (level = score)
  rect(T.cx - T.w / 2 + 3, T.bottom, T.w - 2, 2, 'rgba(60,30,10,.35)');
  drawTumblerBack(T);
  const lvl = T.levelY(CT.fillShown * 0.9);
  if (CT.fillShown > 0.01) drawLiquidRows(T, lvl, y => rgbStr(MISU[y === lvl ? 1 : (y + (y >> 2)) % 5 === 0 ? 4 : 3]));
  drawTumblerFront(T, { label: true });
  drawParticles(now, 0);
  for (const it of CT.items) ctItem(it, t);
  if (!still || CT.sub !== 'ready') { const s = ctStickPos(now); drawRotated(STICK.body, s.x, s.y, s.a); }
  drawParticles(now, 1);
  ctx.restore();
}
function ctHUD(now) {
  const h = G.ct.hud.h;
  rect(0, 0, W, h, '#2a1c14'); rect(0, h, W, 1, YEL); rect(0, h + 1, W, 1, 'rgba(0,0,0,.4)');
  text('SCORE', 8, 4, { c: '#c9b8a6' });
  const pop = now - (CT.pops.length ? CT.pops[CT.pops.length - 1].t : -1e9) < 120 ? -1 : 0;
  text(String(CT.score), 8, 13 + pop, { s: 2, c: YEL });
  let ms = ctDur();
  if (CT.sub === 'running') ms = Math.max(0, ctDur() - (now - CT.t0)); else if (CT.sub === 'result') ms = 0;
  const secs = String(Math.ceil(ms / 1000)).padStart(2, '0');
  text('TIME', W / 2, 4, { c: '#c9b8a6', align: 'center' });
  text(secs, W / 2, 13, { s: 2, c: ms < 5000 && CT.sub === 'running' && Math.floor(now / 250) % 2 ? '#ff6a4a' : CREAM, align: 'center' });
  text('BEST', W - 38, 4, { c: '#c9b8a6', align: 'right' });
  text(bestStr(), W - 38, 13, { s: 2, c: '#ffd23a', align: 'right' });
  const k = ms / ctDur();
  rect(0, h + 2, Math.round(W * k), 2, k < 0.2 ? '#e23b2c' : MAROON);
}
function ctLegend(now, t) {
  const L = G.ct.legend;
  if (L.h < 96) return;
  card(L.x, L.y, L.w, L.h, PAPER);
  text('HOW TO PLAY', L.x + L.w / 2, L.y + 7, { align: 'center', c: MAROON });
  dotted(L.x + 8, L.y + 18, L.w - 16, '#c8b98a');
  const k = Math.floor(t * 2) % ENTRY_INGR.length, ik = j => INGR_SPR[ENTRY_INGR[j % ENTRY_INGR.length].i];
  const rows = [
    [() => { ctx.drawImage(ik(k), L.x + 4, 6); ctx.drawImage(ik(k + 3), L.x + 24, 6); }, '7 KOREAN INGREDIENTS', '+1', INK],
    [() => { ctx.drawImage(CHARS.girl.cheer[Math.floor(t * 3) % 2], L.x + 4, 0); ctx.drawImage(CHARS.boy.wave[Math.floor(t * 3) % 2], L.x + 22, 0); }, 'OYAMIL FRIENDS', '+2', MAROON],
    [() => ctx.drawImage(GOLDS.boy.jump[Math.floor(t * 3) % 2], L.x + 14, 0), 'GOLDEN FRIEND (FAST!)', '+5', '#b88a10'],
    [() => ctx.drawImage(BOMB, L.x + 20, 8), 'BOMB = SCORE RESET!', '0', '#e23b2c'],
  ];
  const rh = Math.min(30, Math.floor((L.h - 42) / 4));
  text('LAST 10 SEC = BOMB RUSH!', L.x + L.w / 2, L.y + L.h - 11, { align: 'center', c: '#e23b2c' });
  rows.forEach(([icon, label, pts, col], i) => {
    const y = L.y + 22 + i * rh;
    ctx.save(); ctx.translate(0, y + Math.round((rh - 32) / 2)); icon(); ctx.restore();
    text(label, L.x + 50, y + Math.round(rh / 2) - 4, { c: INK });
    text(pts, L.x + L.w - 10, y + Math.round(rh / 2) - 7, { s: 2, c: col, align: 'right' });
  });
}
function ctDraw(now, t) {
  const P = G.ct;
  ctScene(now, t, false);
  if (CT.sub === 'ready') {
    ctLegend(now, t);
    const blink = Math.floor(now / 400) % 2 === 0;
    text('SLIDE THE STICK', W / 2, P.home.y + 50, { s: 2, c: blink ? MAROON : INK, align: 'center', outline: WHITE });
    text('TO SPRINKLE THE POWDER!', W / 2, P.home.y + 68, { align: 'center', c: INK, outline: WHITE });
    if (!CT.drag) {                                    // ghost finger swipe hint
      const ph = (t % 1.6) / 1.6, gx = P.home.x - 20 + easeInOut(clamp(ph * 1.3, 0, 1)) * 50;
      if (ph < 0.8) { disc(gx, P.home.y + 20, 5, 'rgba(255,255,255,.6)'); disc(gx, P.home.y + 20, 2, 'rgba(27,23,18,.4)'); }
      text('◀ ▶', P.home.x, P.home.y + 34, { align: 'center', c: 'rgba(27,23,18,.6)' });
    }
  }
  ctHUD(now);
  for (const r of CT.rings) { const k = (now - r.t) / 250, rr = Math.round(4 + k * 8); for (let a = 0; a < 12; a++) rect(r.x + Math.cos(a / 12 * 6.28) * rr, r.y + Math.sin(a / 12 * 6.28) * rr, 1, 1, 'rgba(255,255,255,.7)'); }
  for (const p of CT.pops) {
    const k = (now - p.t) / 800, y = p.y - 8 - k * 26;
    text(p.txt, p.x, y, { s: p.s, c: p.c, outline: INK, align: 'center' });
  }
  if (now - CT.flashT < 160) rect(0, 0, W, H, `rgba(255,60,40,${(0.45 * (1 - (now - CT.flashT) / 160)).toFixed(2)})`);
  if (now - CT.goldT < 120) rect(0, 0, W, H, 'rgba(255,230,120,.25)');
  if (CT.rushT && CT.sub === 'running') {
    rect(0, 0, W, H, `rgba(226,59,44,${(0.06 + 0.05 * Math.sin(now / 160)).toFixed(3)})`);
    const u = now - CT.rushT;
    if (u < 1800 && Math.floor(u / 200) % 2 === 0) {
      text('BOMB RUSH!', W / 2, H * 0.2, { s: 4, c: '#ff6a4a', outline: INK, shadow: '#5a0f08', sd: 2, align: 'center' });
      text('LAST 10 SECONDS - WATCH OUT!', W / 2, H * 0.2 + 34, { c: CREAM, outline: INK, align: 'center' });
    }
  }
  if (CT.sub === 'intro' || (CT.sub === 'running' && now - CT.t0 < 600)) text('GO!', W / 2, H * 0.38, { s: 5, c: YEL, outline: INK, shadow: MAROON, sd: 2, align: 'center' });
  if (CT.sub === 'result') {
    flush();
    const c = CT.caught;
    drawResultBanner(now, CT.resT, Math.round(H * 0.34), 'TIME UP!', `${CT.score} POINTS`, CT.score >= 10, `GRAIN ${c.i} · FRIEND ${c.c} · GOLD ${c.g} · BOMB ${c.b}`);
    drawButton(P.btn, 'RANKING ▶', '#6f8fd8', '#3d5a9c', WHITE, now, (now - CT.resT) / (RESULT_MS + 600));
  }
}

let GAME = GAME_CATCH;

/* ================= BOOT ================= */
for (const def of HUB || [GAME]) loadGameData(def);
bindData();
// analog film grain texture (procedural)
(function makeGrain() {
  const c = makeSprite(160, 96, () => { const v = Math.random() * 255 | 0; return [v, v, v, 255]; });
  grain.style.backgroundImage = `url(${c.toDataURL()})`;
  grain.style.backgroundSize = '160px 96px';
})();
rebuildRanking();
resize();
slideReset();
for (const def of HUB || [GAME]) initDB(def.id);
requestAnimationFrame(frame);

})();
